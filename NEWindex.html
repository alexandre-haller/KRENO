function lineChart(series,labels,colors=['#1C0E8C','#6F60B8'],max=100){const w=640,h=230,l=42,r=20,t=18,b=35,iw=w-l-r,ih=h-t-b;let svg='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Trend chart">';for(let i=0;i<=4;i++){const y=t+ih*i/4;svg+='<path d="M'+l+' '+y+'H'+(w-r)+'" stroke="#D9D3EA" stroke-dasharray="3 4"/><text x="'+(l-9)+'" y="'+(y+4)+'" text-anchor="end" fill="#6F60B8" font-size="11">'+Math.round(max*(1-i/4))+'</text>'}series.forEach((values,s)=>{const pts=values.map((v,i)=>[l+i*iw/Math.max(1,values.length-1),t+ih*(1-v/max)]);if(s===0)svg+='<polygon points="'+l+','+(t+ih)+' '+pts.map(p=>p.join(',')).join(' ')+' '+(w-r)+','+(t+ih)+'" fill="#1C0E8C" opacity=".07"/>';svg+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+colors[s%colors.length]+'" stroke-width="3" stroke-linejoin="round"/>';pts.forEach((p,i)=>svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+colors[s%colors.length]+'"><title>'+escapeHTML(labels[i]||('Point '+(i+1)))+': '+values[i]+'</title></circle>')});labels.forEach((v,i)=>{if(i===0||i===labels.length-1||i%Math.ceil(labels.length/5)===0)svg+='<text x="'+(l+i*iw/Math.max(1,labels.length-1))+'" y="'+(h-10)+'" text-anchor="middle" fill="#6F60B8" font-size="11">'+escapeHTML(v)+'</text>'});return svg+'</svg>'}

function statusClass(s){
  s=String(s||'').toLowerCase();
  if(s.includes('released')||s.includes('escalated'))return 'st-red';
  if(s.includes('completed')||s.includes('rebooked'))return 'st-blue';
  if(s.includes('confirmed')||s.includes('accepted'))return 'st-green';
  if(s.includes('reschedule'))return 'st-purple';
  if(s.includes('no answer'))return 'st-yellow';
  if(s.includes('to contact'))return 'st-orange';
  return 'st-gray';
}

function ensureData(){
  if(state.generated)return;
  state.patients.forEach(p=>{if(p.day===undefined)p.day=0});
  state.waiters.forEach(w=>{if(w.day===undefined)w.day=0});
  let seed=42;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const first=['Mia','Lucas','Chloe','Mason','Isabella','Logan','Amelia','Jacob','Harper','Henry','Ella','Jack'];
  const last=['Johnson','Martin','White','Clark','Lewis','Walker','Hall','Young','King','Scott','Green','Baker'];
  const types=[['Follow-up',100],['Mental therapy',130],['Initial assessment',180]];
  const reasons=['Transport','Childcare','Reminder','Cost','Unknown'];
  const times=['08:30','09:15','10:00','10:45','11:30','13:00','13:45','14:30','15:15','16:00'];
  const clinics=[['Vista Clinic','The Vista'],['Shandon Clinic','Shandon'],['Five Points Clinic','Five Points']];
  let n=1,wn=1;
  for(let d=1;d<=14;d++){
    const weekend=[0,6].includes(dateOf(d).getDay());
    [...times].sort(()=>rnd()-.5).slice(0,weekend?3:7).sort().forEach(time=>{
      const [type,fee]=pick(types),reason=pick(reasons);
      const base=Math.round(25+rnd()*62),dist=+(1.5+rnd()*11).toFixed(1);
      const history=Array.from({length:9},(_,i)=>Math.max(5,Math.min(95,Math.round(base+(i-8)*(rnd()*4-1)+(rnd()-.5)*4))));
      history[8]=base;
      state.patients.push({id:'P'+(100+n++),name:pick(first)+' '+pick(last),day:d,time,type,fee,base,score:base,
        reason,distance:dist,minutes:Math.round(dist*2.3+4),children:reason==='Childcare'?1+Math.floor(rnd()*2):0,
        status:base>=50?'To contact':'Scheduled',confirmed:false,solution:'',consent:rnd()>.1,history});
    });
    for(let k=0;k<(weekend?1:3);k++){
      const [clinic,area]=pick(clinics),[type]=pick(types);
      state.waiters.push({id:'W-'+(300+wn++),clinic,type,area,start:pick(['08:30','09:00','10:00','12:00']),
        end:pick(['14:00','16:00','16:30','17:00']),wait:Math.floor(2+rnd()*12),status:'Waiting',day:d});
    }
  }
  state.generated=true;
}

function release(id){const p=patient(id);if(!p||!active(p))return;if(!confirm('Publish the '+p.time+' slot? Confirm only after the patient has cancelled or agreed to reschedule.'))return;p.status='Released';state.slots.push({id:'S-'+(state.slots.length+101),patient:p.id,day:p.day,time:p.time,type:p.type,fee:p.fee,status:'Published'});log('Released '+p.time+' after manual confirmation. Published a minimal matching entry.');notify('Slot published to Smart waitlist.');render()}
function accept(id){const o=state.offers.find(o=>o.id===id);if(!o||o.status!=='Pending')return;const s=state.slots.find(s=>s.id===o.slot),w=state.waiters.find(w=>w.id===o.waiter);if(s.status!=='Published'||w.status!=='Waiting')return; o.status='Accepted';s.status='Booked';s.waiter=w.id;w.status='Matched';state.offers.forEach(other=>{if(other.id!==o.id&&other.status==='Pending'&&(other.slot===s.id||other.waiter===w.id))other.status='Closed'});patient(s.patient).status='Rebooked';log(w.id+' accepted '+s.id+'. Competing offers closed.');notify('Replacement booked; pending revenue updated.');render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;render();return}const el=e.target.closest('[data-action]');if(!el)return;const id=el.dataset.id,p=patient(id),action=el.dataset.action;if(action==='select')choosePatient(id);else if(action==='openAlt'||action==='openCall'){state.selected=id;view=action==='openAlt'?'alternatives':'calls';render()}else if(action==='previous'||action==='next'){const list=scopePatients(),i=list.findIndex(x=>x.id===state.selected);choosePatient(list[(i+(action==='next'?1:-1)+list.length)%list.length].id)}else if(action==='confirm'){if(!p.consent){notify('Contact permission is declined.');return}p.confirmed=true;p.status='Confirmed';recalc(p);log(p.name+' confirmed the visit. Score updated to '+p.score+'%.');render()}else if(action==='solution'){if(!active(p))return;if(!confirm('Simulate patient acceptance of '+el.dataset.value+'?'+(el.dataset.value==='Telehealth'?' This also simulates clinician approval.':'')))return;p.solution=el.dataset.value;p.status=p.solution==='Reschedule'?'Reschedule requested':p.solution==='Telehealth'?'Video confirmed':'Alternative accepted';if(p.solution==='Reschedule')p.solution='';recalc(p);log(p.name+': '+el.dataset.value+' selected (simulation).');notify('Decision recorded. Scores and dashboard updated.');render()}else if(action==='release')release(id);else if(action==='period'){period=Number(el.dataset.value);render()}else if(action==='offer'){const s=state.slots.find(s=>s.id===id),w=state.waiters.find(w=>w.id===el.dataset.value);if(!s||!w||s.status!=='Published'||!matches(s,w)||state.offers.some(o=>o.slot===id&&o.waiter===w.id&&o.status==='Pending'))return;state.offers.push({id:'O-'+(state.offers.length+1),slot:id,waiter:w.id,status:'Pending'});log('Offer sent for '+id+' to '+w.id+' (simulation).');render()}else if(action==='accept')accept(id);else if(action==='decline'){const o=state.offers.find(o=>o.id===id);if(o&&o.status==='Pending'){o.status='Declined';log(o.waiter+' declined '+o.slot+'. Slot remains available.');render()}}else if(action==='complete'){const s=state.slots.find(s=>s.id===id);if(!s||s.status!=='Booked')return;s.status='Completed';patient(s.patient).status='Completed';state.finance.push({daysAgo:0,value:s.fee,cost:12,source:'Network waitlist'});log(s.id+' completed. '+money(s.fee)+' realized replacement revenue recorded.');render()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='weather'||el.id==='holiday'){if(el.id==='weather')state.weather=el.value;else state.holiday=el.checked;state.patients.forEach(recalc);log('External context updated; all local scores recalculated.');render()}else if(el.id==='threshold'){state.threshold=Number(el.value);render()}else if(el.id==='clinic'){clinic=el.value;render()}else if(el.dataset.change){const p=patient(el.dataset.id);if(el.dataset.change==='reason'){p.reason=el.value;recalc(p);log(p.name+': declared reason updated to '+p.reason+'.')}else if(el.dataset.change==='outcome'&&el.value){p.status=el.value;log(p.name+': '+el.value+'.')}else if(el.dataset.change==='consent'){p.consent=el.value==='yes';log(p.name+': contact permission '+(p.consent?'allowed':'declined')+'.')}render()}else if(el.dataset.note){const p=patient(el.dataset.note);p.note=el.value;log(p.name+': post-call note saved.')}});
$('#brand').innerHTML='<a href="website.html" title="Back to the KRENO website" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none"><img src="logo.png" alt="KRENO logo" class="logo-img"><div><b>KRENO</b><small>Medical scheduling copilot</small></div></a>'; 
$('#reset').onclick=()=>{if(!confirm('Reset all simulated decisions and restore the demo?'))return;state=initial();view='dashboard';clinic='All clinics';period=30;save();render();notify('Demo reset.')};
// Export the actual inline source plus current demo state, never an empty app shell.
$('#export').onclick=()=>{save();const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#nav').innerHTML='';clone.querySelector('#toast').hidden=true;clone.querySelector('#toast').textContent='';let boot=clone.querySelector('#kreno-export-state');if(boot)boot.remove();boot=document.createElement('script');boot.id='kreno-export-state';boot.textContent='try{localStorage.setItem("kreno-offline-v1",'+JSON.stringify(JSON.stringify(state)).replace(/</g,'\\u003c')+')}catch{}';const appScript=clone.querySelector('body > script');clone.querySelector('body').insertBefore(boot,appScript);const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kreno-demo.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Complete standalone HTML exported.');};
render();
